# Fly.io config for the NexgenSocial backend (API + WebSocket signaling +
# mediasoup SFU). Customize `app` and `primary_region` via `fly launch` or
# by editing directly. See FLY_DEPLOY.md for the full setup walkthrough --
# in particular, MEDIASOUP_ANNOUNCED_IP MUST be set as a secret to your
# app's actual dedicated IPv4 address, which doesn't exist until you
# allocate one (`fly ips allocate-v4`). This file alone is not enough.

app = "nexgensocial-backend" # change this to your own app name
primary_region = "iad"       # change to whichever region you launch in

[build]

[env]
  PORT = "4000"
  NODE_ENV = "production"
  # Single-port SFU mode (see backend/src/sfu/worker.js) -- both the UDP
  # and TCP service blocks below point at this same port.
  MEDIASOUP_WEBRTC_PORT = "44444"
  MEDIASOUP_LISTEN_IP = "0.0.0.0"
  MEDIASOUP_WORKER_COUNT = "1"
  # Stripe payment link shown to advertisers. Ads stay in PENDING_PAYMENT
  # until confirmed -- a payment link alone can't verify that anyone paid,
  # so see README "Advertising payments" before taking real money.
  STRIPE_PAYMENT_LINK = "https://buy.stripe.com/eVq00jgRAbXLcHhbbA1oI0o"
  # MEDIASOUP_ANNOUNCED_IP is NOT set here on purpose -- set it as a secret
  # (`fly secrets set MEDIASOUP_ANNOUNCED_IP=...`) once you know your
  # app's dedicated IPv4. Leaving it as this file's default would silently
  # break every stream in production.

# A live stream in progress means an open mediasoup worker with active
# transports -- letting Fly stop the machine when it looks "idle" (the
# default autoscaling behavior) would drop streams. Keep at least one
# machine running at all times.
[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

# --- mediasoup media traffic: single UDP+TCP port pair ---
# UDP requires a dedicated (not shared) IPv4 address on Fly -- see
# FLY_DEPLOY.md. TCP is the fallback path for networks that block UDP.
[[services]]
  internal_port = 44444
  protocol = "udp"
  [[services.ports]]
    port = 44444

[[services]]
  internal_port = 44444
  protocol = "tcp"
  [[services.ports]]
    port = 44444

# 512MB was too tight for Node + Prisma + a mediasoup worker running
# together in practice -- it showed up as the mediasoup worker getting
# OOM-killed, which (before a related code fix) crashed the whole process
# and caused a restart loop. 1024MB is a safer floor; Fly's shared-cpu-1x
# plan supports up to 2048MB if streams still misbehave under load.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

# Uploaded photos/videos live on disk at src/uploads (see routes/posts.js
# and routes/users.js) -- without this, that's the container's own
# filesystem, which is wiped on every restart or redeploy. Any of the many
# secret-setting redeploys during initial setup would have silently
# deleted every uploaded file up to that point, even though the database
# rows pointing at them survive fine (in Postgres, which is separate).
# This volume is what makes uploads actually durable. Create it once with
# `fly volumes create nexgensocial_uploads --size 1 -a <your-app-name>`
# (see FLY_DEPLOY.md) BEFORE deploying this config -- deploying with a
# [[mounts]] block that references a volume that doesn't exist yet fails.
[[mounts]]
  source = "nexgensocial_uploads"
  destination = "/app/src/uploads"
